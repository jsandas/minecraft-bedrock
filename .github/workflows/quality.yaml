name: Quality
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    permissions:
      contents: read
    name: Lint Checks
    uses: jsandas/github-actions/.github/workflows/golang-lint.yml@1074e912fa97bdcbff9036467bb27ddee54fb91a
    with:
      golangci_lint_version: v2.15.0

  security:
    permissions:
      contents: read
      security-events: write
    name: Security Checks
    uses: jsandas/github-actions/.github/workflows/golang-security.yml@1074e912fa97bdcbff9036467bb27ddee54fb91a
    with:
      go_version_file: "go.mod"